[project]
name = "security-agent-platform"
version = "0.1.0"
description = "Proof-of-concept AI-agentic code security analysis platform: LangGraph agents + specialized scanners + LLMs, designed for CI"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langgraph>=0.1.5",
    "langchain-core>=0.2.5",
    "langchain-text-splitters>=0.2.0",
    "litellm>=1.40.0",
    "sqlalchemy>=2.0.30",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.4",
    "opentelemetry-api==1.37.0",
    "opentelemetry-sdk==1.37.0",
    "opentelemetry-instrumentation==0.58b0",
    "opentelemetry-instrumentation-fastapi==0.58b0",
    "opentelemetry-instrumentation-asgi==0.58b0",
    "opentelemetry-util-http==0.58b0",
    "opentelemetry-semantic-conventions==0.58b0",
    "opentelemetry-exporter-otlp==1.37.0",
    "opentelemetry-exporter-prometheus==0.58b0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "gitpython>=3.1.43",
    "python-multipart>=0.0.9",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
