server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      # App logs are single-line JSON (structlog JSONRenderer); parse so fields like
      # analysis_id, event, tool_name become queryable Loki labels/filters, not just text.
      # repo mirrors the same `repo` attribute already set on every trace span
      # (app.observability.tracing.repo_identifier) so logs and traces can be
      # filtered/correlated by the same scanned-repo identity.
      - json:
          expressions:
            analysis_id: analysis_id
            event: event
            level: level
            repo: repo
      - labels:
          analysis_id:
          event:
          level:
          repo:
