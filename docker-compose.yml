services:
  app:
    build: .
    ports:
      - "8001:8000"
    environment:
      APP_ENVIRONMENT: local
      APP_LOG_LEVEL: INFO
      APP_STORAGE_BACKEND: postgres
      APP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/security_platform
      APP_REDIS_URL: redis://redis:6379/0
      APP_WORKSPACE_DIR: /app/data/workspaces
      APP_REPORTS_DIR: /app/data/reports
      MODEL_MOCK_MODE: "${MODEL_MOCK_MODE:-true}"
      OTEL_SERVICE_NAME: security-agent-platform
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_ENABLED: "true"
      OTEL_METRICS_ENABLED: "true"
      OTEL_LOGS_ENABLED: "true"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Read-only so a scan can never modify a target project's source. Place any repo to
      # scan under ./scan-targets/<repo-name> (or set SCAN_TARGETS_DIR) on the host; it appears
      # at the same subpath here, e.g. local_path: "/scan-targets/<repo-name>".
      - ${SCAN_TARGETS_DIR:-./scan-targets}:/scan-targets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      otel-collector:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: security_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:3.0.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infra/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"

  # Ships container stdout (structlog JSON from the app) to Loki. Reads the Docker
  # socket directly rather than going through the otel-collector, since the app emits
  # logs to stdout, not via an OTLP log exporter.
  promtail:
    image: grafana/promtail:3.0.0
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./infra/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo-config.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4327:4317"

volumes:
  postgres-data:
